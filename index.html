<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101113'/%3E%3Ccircle cx='16' cy='16' r='8' stroke='%23f59e0b' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%2334d399'/%3E%3Cpath d='M16 4v4M16 24v4M4 16h4M24 16h4' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoMind — Software Intelligence & Reliability Platform</title>
    <meta name="description" content="AI-powered software intelligence platform. Understand codebase architecture, dependencies, risk scores, simulate failures, investigate incidents, and resolve root causes with evidence." />
    <!-- Fonts: Space Grotesk (Display), Plus Jakarta Sans (Reading), JetBrains Mono (Technical), Newsreader (Editorial Italic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('repomind-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && systemDark) || (saved === 'system' && systemDark)) {
            document.documentElement.classList.add('dark');
          } else if (saved === 'light' || (!saved && !systemDark) || (saved === 'system' && !systemDark)) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased overflow-x-clip selection:bg-amber-500/25 selection:text-amber-800 dark:selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
